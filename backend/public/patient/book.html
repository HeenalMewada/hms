<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Book Appointment</h5>
    </div>

    <div class="card-body">
      <form id="bookform">
 <input type="hidden" id="patient_id">
        <!-- Day Selection -->
        <div class="mb-3">
            <label class="form-label">Select Doctor</label>
    <select class="form-select" id="doctor_id" required>
      <option value="">-- Select Doctor --</option>
      <option value="1">Dr. Patel</option>
      <option value="2">Dr. Mehta</option>
      <option value="3">Dr.Desai</option>
      <option value="4">Dr.Shah</option>
      <option value="5">Dr. Joshi</option>
    </select>
          
        </div>  
         <div class="mb-3">
    <label class="form-label">Purpose</label>
    <input type="text" class="form-control" id="purpose" required>
  </div>      
        <div class="mb-3">
    <label class="form-label">Date</label>
    <input type="date" class="form-control" id="date" required>
  </div>

  <div class="mb-3">
    <label class="form-label">Time</label>
    <input type="time" class="form-control" id="time" required>
  </div>

 


        <!-- Submit -->
        <div class="text-end">
          <button type="submit" class="btn btn-success">Book Appointment</button>
        </div>

      </form>
    </div>
  </div>
</div>
</body>
 <script>

document.getElementById("bookform").addEventListener("submit", function(e) {
  e.preventDefault();

  // Collect form data
  const data = {
    patient_id: localStorage.getItem("patient_id"),
    doctor_id: document.getElementById("doctor_id").value,
    // day: document.getElementById("day").value,
    date: document.getElementById("date").value,
    time: document.getElementById("time").value,
    purpose: document.getElementById("purpose").value
  };

  // Send data to server
  fetch("http://localhost:8080/patient/book-appointment", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(result => {
    alert(result.message);

    // Save appointment to localStorage after server success
    let appointments = JSON.parse(localStorage.getItem("appointments")) || [];
    appointments.push({
      date: data.date,
      time: data.time,
      purpose: data.purpose,
      doctor_id: data.doctor_id,
      doctor_name: document.querySelector("#doctor_id option:checked").text,
      date_created: new Date().toLocaleDateString(),
    });
    localStorage.setItem("appointments", JSON.stringify(appointments));
  })
  .catch(err => console.error(err));
});

</script> 





</html>
