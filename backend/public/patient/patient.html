<script>
  function logout(){
     window.location.href = '../login.html';
  }
let appointments = JSON.parse(localStorage.getItem("appointments")) || [];

let today = new Date().toISOString().split("T")[0];

let upcoming = appointments.filter(app => app.date >= today);
let past = appointments.filter(app => app.date < today);

// Total Appointments
document.getElementById("total-count").innerText = appointments.length;

// Upcoming Appointments
document.getElementById("upcoming-count").innerText = upcoming.length;

// Last Visit (latest past date)
if (past.length > 0) {
    let last = past.sort((a, b) => b.date.localeCompare(a.date))[0];
    document.getElementById("last-visit").innerText = last.date;
} else {
    document.getElementById("last-visit").innerText = "No visits yet";
}

// Unique Doctors Count
let doctors = [...new Set(appointments.map(app => app.doctor_name))];
document.getElementById("doctors-consulted").innerText = doctors.length;


</script>
