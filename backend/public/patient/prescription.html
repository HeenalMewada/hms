<!DOCTYPE html>
<html>
<head>
    <title>Patient Prescriptions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h4>My Prescriptions</h4>

        <input type="text" id="searchPatient" class="form-control mb-3" placeholder="Enter Patient Name">
        <button class="btn btn-primary mb-3" onclick="loadPrescriptions()">Search</button>

        <table class="table table-bordered text-center">
            <thead class="table-dark">
                <tr>
                    <th>Date</th>
                    <th>Doctor</th>
                    <th>Medicine</th>
                    <th>Dosage</th>
                    <th>Duration</th>
                </tr>
            </thead>
            <tbody id="prescriptionTable"></tbody>
        </table>
    </div>
</div>

<script>
function loadPrescriptions() {

    let patientName = document.getElementById("searchPatient").value;
    let prescriptions = JSON.parse(localStorage.getItem("prescriptions")) || [];
    let table = document.getElementById("prescriptionTable");

    table.innerHTML = "";

    prescriptions.forEach(p => {
        if(p.patient === patientName) {
            table.innerHTML += `
                <tr>
                    <td>${p.date}</td>
                    <td>${p.doctor}</td>
                    <td>${p.medicine}</td>
                    <td>${p.dosage}</td>
                    <td>${p.days}</td>
                </tr>
            `;
        }
    });
}
</script>

</body>
</html>
