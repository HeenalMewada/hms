<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patient Dashboard - Appointments</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
  <div class="container my-5">
    <h2 class="mb-4">Appointments</h2>
    
    <!-- Summary Cards -->
    <div class="row mb-4">
      <div class="col-md-3 mb-3">
        <div class="card text-white bg-primary h-100">
          <div class="card-body">
            <h5 class="card-title">Upcoming Appointments</h5>
            <p class="card-text display-4" id="upcoming-count"></p>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card text-white bg-success h-100">
          <div class="card-body">
            <h5 class="card-title">Total Appointments</h5>
            <p class="card-text display-4" id="total-count"></p>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card text-white bg-info h-100">
          <div class="card-body">
            <h5 class="card-title">Last Visit</h5>
            <p class="card-text lead" id="last-visit"></p>
          </div>
        </div>
      </div>
      <div class="col-md-3 mb-3">
        <div class="card text-white bg-warning h-100">
          <div class="card-body">
            <h5 class="card-title">Doctors Consulted</h5>
            <p class="card-text display-4" id="doctors-consulted"></p>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Upcoming Appointments Table -->
    <h4>Upcoming Appointments</h4>
    <div class="table-responsive mb-4">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>Date</th>
            <th>Time</th>
            <th>Doctor</th>
            <th>Purpose</th> 
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="pbody">
          
        </tbody>
      </table>
    </div>
    
    <!-- Past Appointments -->
    <h4>Past Appointments</h4>
    <div class="table-responsive mb-4">
      <table class="table table-striped table-hover">
        <thead class="table-secondary">
          <tr>
            <th>Date</th>
            <th>Doctor</th>
            <th>Purpose</th>
          
          </tr>
        </thead>
        <tbody id="pastAppointment">
          </tbody>
          <!-- Add more past appointments here -->
        </tbody>
      </table>
    </div>
  </div>
  
  <!-- Bootstrap JS (Optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
<script>
  let appointments = JSON.parse(localStorage.getItem("appointments")) || [];
   localStorage.setItem('appointments', JSON.stringify(appointments)); 

document.addEventListener("DOMContentLoaded", () => {

    const upcomingBody = document.getElementById("pbody");
    const pastBody = document.getElementById("pastAppointment");

    

    let upcomingCount = 0;
    let totalCount = appointments.length;
    let doctorsSet = new Set();
    let lastVisit = "-";

    const today = new Date();

    appointments.forEach(app => {

        const appDate = new Date(app.date);
        doctorsSet.add(app.doctor_name);

        const row = document.createElement("tr");

        if(appDate >= today) {
            // Upcoming Appointment
            upcomingCount++;

            row.innerHTML = `
                <td>${app.date}</td>
                <td>${app.time}</td>
                <td>${app.doctor_name}</td>
                <td>${app.purpose}</td>
                <td>
                    <button class="btn btn-danger btn-sm cancelBtn">
                        Cancel
                    </button>
                </td>
            `;

            upcomingBody.appendChild(row);

            row.querySelector(".cancelBtn").addEventListener("click", () => {
                alert("Appointment Cancelled");
                row.remove();
            });

        } else {
            // Past Appointment
            lastVisit = app.date;


            row.innerHTML = `
                <td>${app.date}</td>
                <td>${app.doctor_name}</td>
                <td>${app.purpose}</td>
                
            `;

            pastBody.appendChild(row);
        }
    });

    // Update Summary Cards
    document.getElementById("upcoming-count").innerText = upcomingCount;
    document.getElementById("total-count").innerText = totalCount;
    document.getElementById("doctors-consulted").innerText = doctorsSet.size;
    document.getElementById("last-visit").innerText = lastVisit;

});
 
 

const params = new URLSearchParams(window.location.search);

    document.getElementById("patient").innerText = params.get("patient");
    document.getElementById("medicine").innerText = params.get("medicine");
    document.getElementById("dosage").innerText = params.get("dosage");
    document.getElementById("days").innerText = params.get("days");

</script>

</html>
