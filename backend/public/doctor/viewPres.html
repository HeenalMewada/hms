<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Prescription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card">
        <div class="card-header text-center">
            <h4>Prescription</h4>
        </div>
        <div class="card-body">

            <p><strong>Patient:</strong> <span id="patient"></span></p>
            <p><strong>Medicine:</strong> <span id="medicine"></span></p>
            <p><strong>Dosage:</strong> <span id="dosage"></span></p>
            <p><strong>Days:</strong> <span id="days"></span></p>

            <button class="btn btn-secondary" onclick="window.history.back()">Back</button>
            <button class="btn btn-primary" onclick="window.print()">Print</button>

        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);

    document.getElementById("patient").innerText = params.get("patient");
    document.getElementById("medicine").innerText = params.get("medicine");
    document.getElementById("dosage").innerText = params.get("dosage");
    document.getElementById("days").innerText = params.get("days");
</script>

</body>
</html>
