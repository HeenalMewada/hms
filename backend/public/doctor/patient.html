<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Patients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container-fluid">
        <div class="row">

            <!-- Sidebar -->



            <!-- Main Content -->
            <div class="col-md-10 p-4">

                <h4 class="mb-3">Patients</h4>

                <!-- Search -->
                <div class="card mb-3">
                    <div class="card-body">
                        <div class="row g-2">
                            <div class="col-md-4">
                                <input type="text" class="form-control" placeholder="Search patient name">
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-primary w-100">Search</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Patients Table -->
                <div class="card">
                    <div class="card-body">
                        <table class="table table-bordered">
                            <thead class="table-light">
                                <tr>
                                    <th>#</th>
                                    <th>Patient Name</th>
                                    <th>Medicine</th>
                                    <th>Dosage</th>
                                    <th>Days</th>
                                   

                                </tr>
                            </thead>
                            <tbody>



                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const tbody = document.querySelector("tbody");
        const prescriptions = JSON.parse(localStorage.getItem("prescriptions")) || [];

        prescriptions.forEach((prescription, index) => {
            const row = document.createElement("tr");
            row.innerHTML = `
      <td>${index + 1}</td>
      <td>${prescription.patient}</td>
      <td>${prescription.medicine}</td>
      <td>${prescription.dosage}</td>
      <td>${prescription.days}</td>
      <td>
      
      <td>
            <button class="btn btn-info btn-sm viewBtn">View</button>
            <button class="btn btn-secondary btn-sm printBtn">Print</button>
        </td>
    `;
            tbody.appendChild(row);
            row.querySelector(".viewBtn").addEventListener("click", () => {
                let cells = row.children;
                const patient = encodeURIComponent(cells[1].innerText);
      const medicine = encodeURIComponent(cells[2].innerText);
      const dosage = encodeURIComponent(cells[3].innerText);
      const days = encodeURIComponent(cells[4].innerText);
      const url = `./viewPres.html?patient=${patient}&medicine=${medicine}&dosage=${dosage}&days=${days}`;
      window.location.href = url;
                //   const days = encodeURIComponent(cells[4].innerText);

            });

            row.querySelector(".printBtn").addEventListener("click", () => {
                window.print();
                const url = `./viewPres.html?patient=${patient}&medicine=${medicine}&dosage=${dosage}&days=${days}`;
                window.location.href = url;
            });
        });

    });
</script>

</html>
