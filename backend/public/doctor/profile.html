<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Doctor Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      background-color: #f8f9fa;
    }
    .profile-container {
      max-width: 900px;
      margin: 50px auto;
      background-color: #ffffff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    
    
    .form-label {
      font-weight: 500;
      color: #555;
    }
    
    
    .btn-primary:hover {
      background-color: #0069d9;
    }
    
  </style>
</head>
<body>
<div class="profile-container">
<h2>My Profile</h2>
<hr>
    <!-- Personal Details -->
     
    <div class="mb-3 row">
        
      <label for="doctorName" class="col-sm-3 col-form-label form-label">Name</label>
      <div class="col-sm-9">
        <input type="text" class="form-control" id="doctorName" placeholder="Dr. Heenal" required>
      </div>
    </div>
    <div class="mb-3 row">
      <label for="email" class="col-sm-3 col-form-label form-label">Email</label>
      <div class="col-sm-9">
        <input type="email" class="form-control" id="email" placeholder="doctor@example.com" required>
      </div> 
    </div> 
    <div class="mb-3 row">
      <label for="phone" class="col-sm-3 col-form-label form-label">Phone Number</label>
      <div class="col-sm-9">
        <input type="tel" class="form-control" id="phone" placeholder="+1234567890" required>
      </div>
    </div>
    <div class="mb-3 row">
      <label for="address" class="col-sm-3 col-form-label form-label">Address</label>
      <div class="col-sm-9">
        <textarea class="form-control" id="address" rows="3" placeholder="123 Main St, City, State"></textarea>
      </div>
    </div>
    <!-- Professional Details -->
    <hr class="my-4"/>
    <div class="mb-3 row">
      <label for="specialization" class="col-sm-3 col-form-label form-label">Specialization</label>
      <div class="col-sm-9">
        <input type="text" class="form-control" id="specialization" placeholder="Cardiology" required>
      </div>
    </div>
    <div class="mb-3 row">
      <label for="licenseNumber" class="col-sm-3 col-form-label form-label">License Number</label>
      <div class="col-sm-9">
        <input type="text" class="form-control" id="licenseNumber" placeholder="XYZ123456" required>
      </div>
    </div>
    <div class="mb-3 row">
      <label for="experience" class="col-sm-3 col-form-label form-label">Experience</label>
      <div class="col-sm-9">
        <input type="number" class="form-control" id="experience" placeholder="Years of Experience" min="0" required>
      </div>
    </div>
    <!-- Buttons -->
    <div class="d-flex justify-content-end mt-4">
      <button type="submit" class="btn btn-primary me-2">Save Changes</button>
      <button type="reset" class="btn btn-secondary">Cancel</button>
    </div>
  </form>
</div>
</div>



</body>
</html>
