<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prescriptions</title>
   

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <!-- Page Heading -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>Prescriptions</h4>
        <button class="btn btn-primary">Add Prescription</button>
    </div>

    <!-- Add Prescription Form -->
    <div class="card mb-4">
        <div class="card-header">
            <strong>Add Prescription</strong>
        </div>
        <div class="card-body">

            <form>
                <div class="mb-3">
                    <label class="form-label">Doctor Name</label>
                    <input type="text" class="form-control" placeholder="Enter Doctor name" id="doctor">
                </div>
                 <div class="mb-3">
                    <label class="form-label">Patient Name</label>
                    <input type="text" class="form-control" placeholder="Enter patient name" id="patient">
                </div>

                <div class="mb-3">
                    <label class="form-label">Problem / Diagnosis</label>
                    <input type="text" class="form-control" placeholder="e.g. Fever" >
                </div>

                <div class="mb-3">
                    <label class="form-label">Medicine</label>
                    <input type="text" class="form-control" placeholder="e.g. Paracetamol 500mg" id="medicine">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Dosage</label>
                        <input type="text" class="form-control" placeholder="1-0-1" id="dosage">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Days</label>
                        <input type="number" class="form-control" placeholder="5" id="days">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Advice</label>
                    <textarea class="form-control" rows="3" placeholder="Optional"></textarea>
                </div>

                <button type="button" class="btn btn-success" id="addPres">Save Prescription</button>
            </form>

        </div>
    </div>

    <!-- Prescription List -->
    <div class="card">
        <div class="card-header">
            <strong>Prescription List</strong>
        </div>
        <div class="card-body">

            <table class="table table-bordered">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Doctor</th>
                        <th>Patient</th>
                        <th>Medicine</th>
                        <th>Dosage</th>
                        <th>Days</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pbody">
              
                            
                      
                </tbody>
            </table>

        </div>
    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
 <script src="prescription.js"></script>
</html>
