<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Doctor Availability</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Doctor Availability</h5>
    </div>
<input type="hidden" id="doctor_id" value="1">

    <div class="card-body">
      <form id="availabilityForm">

        <!-- Day Selection -->
        <div class="mb-3">
          <label class="form-label">Select Day</label>
          <select class="form-select" id="day" required>
            <option value="">-- Select Day --</option>
            <option>Monday</option>
            <option>Tuesday</option>
            <option>Wednesday</option>
            <option>Thursday</option>
            <option>Friday</option>
            <option>Saturday</option>
            <option>Sunday</option>
          </select>
        </div>

        <!-- Time -->
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">From Time</label>
            <input type="time" class="form-control"  id="start_time">
          </div>
          <div class="col-md-6">
            <label class="form-label">To Time</label>
            <input type="time" class="form-control"  id="end_time">
          </div>
        </div>

        

        <!-- Max Appointments -->
        <div class="mb-3">
          <label class="form-label">Max Appointments Per Day</label>
          <input type="number" class="form-control" placeholder="e.g. 20" id="max_appointments">
        </div>

        <!-- Availability Status -->
        <div class="mb-3">
          <label class="form-label">Availability Status</label>
          <select class="form-select" id="status">
            <option value="available">Available</option>
            <option value="not_available">Not Available</option>
            <option value="leave">On Leave</option>
          </select>
        </div>

        <!-- Submit -->
        <div class="text-end">
          <button type="submit" class="btn btn-success">Save Availability</button>
        </div>

      </form>
    </div>
  </div>
</div>

</body>
<script>

 
document.getElementById("availabilityForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const data = {
    doctor_id: document.getElementById("doctor_id").value,
    day: document.getElementById("day").value,
    start_time: document.getElementById("start_time").value,
    end_time: document.getElementById("end_time").value,
   max_appointments: document.getElementById("max_appointments").value, 
    
    status: document.getElementById("status").value
  };

  fetch("http://localhost:8080/doctor/appointments", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(result => alert(result.message))
  .catch(err => console.log(err));
});
</script>

</html>
