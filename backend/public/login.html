<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

</head>

<body>
    <div class="container" style="margin-top: 100px;">
        <div class="card mx-auto p-4" style="max-width:400px;">

            <h3 class="text-center mb-3">Login to HMS</h3>

            <!-- Tabs -->
            <ul class="nav nav-tabs mx-auto" role="tablist">
                <li class="nav-item">
                    <button class="nav-link active text-bg-primary" data-bs-toggle="tab" data-bs-target="#doctor">
                        <i class="fa-solid fa-user-doctor"></i> Doctor Login
                    </button>
                </li>
                <li class="nav-item">
                    <button class="nav-link text-bg-success ms-2" data-bs-toggle="tab" data-bs-target="#patient">
                        <i class="fa-solid fa-user"></i> Patient Login
                    </button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content mt-3">

                <!-- Doctor Login -->
                <div class="tab-pane fade show active" id="doctor">
                    <div class="input-group input-group-sm mb-3">
                        <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                        <input class="form-control" placeholder="Doctor Email" id="doctorEmail">
                    </div>
                    <div class="input-group input-group-sm mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" placeholder="Password" id="doctorPassword">
                    </div>
                    <button class="btn btn-primary w-100" onclick="login('doctor')">Login as Doctor</button>
                </div>

                <!-- Patient Login -->
                <div class="tab-pane fade" id="patient">
                    <div class="input-group input-group-sm mb-3">
                        <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                        <input class="form-control" placeholder="Patient Email" id="patientEmail">
                    </div>
                    <div class="input-group input-group-sm mb-3">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" placeholder="Password" id="patientPassword">
                    </div>
                    <button class="btn btn-success w-100" onclick="login('patient')">Login as Patient</button>
                    <button class="btn btn-warning w-100 mt-2">Register</button>
                </div>

            </div>
        </div>
    </div>

</body>
<script>
    const demail = document.getElementById('doctorEmail');
    const dpass = document.getElementById('doctorPassword');
    const pemail = document.getElementById('patientEmail');
    const ppass = document.getElementById('patientPassword');
    function login(role) {
        const email = role === "doctor" ? demail.value : pemail.value;
        const password = role === "doctor" ? dpass.value : ppass.value;

        fetch("http://localhost:8080/login", 
        {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password,role})
        })
            .then(res => res.json())
    .then(data => {
        console.log("Server is responsing", data);
        
        if (data.success) {
            if (data.role === "doctor") {
                
                window.location.href = "/doctor/doctor.html";
                 console.log("Doctor ID stored in local storage:", data.doctor_id);
              
                
                
            } else if (data.role === "patient") {
                window.location.href = "/patient/patient.html";
            }
        } else {
            alert("Invalid Login");
        }
    })
    .catch(err => console.error(err));
}


</script>

</html>
